name: pipeline

on:
  schedule:
    - cron: "7 * * * *"        # hourly, at :07 past the hour
  workflow_dispatch: {}        # manual trigger button

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  XRAY_VERSION: "26.10.29"
  SINGBOX_VERSION: "1.14.4"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full main history — needed for the stats amend step

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch previous health history
        run: |
          mkdir -p dist
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/results.json" \
            -o dist/results.json || echo "no history yet — first run"

      - name: Restore engines
        id: engines
        uses: actions/cache@v4
        with:
          path: bin
          key: engines-xray-${{ env.XRAY_VERSION }}-sb-${{ env.SINGBOX_VERSION }}

      - name: Fetch engines (pinned)
        if: steps.engines.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          curl -fsSL -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -oq /tmp/xray.zip xray -d bin
          curl -fsSL -o /tmp/sb.tgz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tgz -C /tmp
          mv "/tmp/sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" bin/
          chmod +x bin/xray bin/sing-box

      - name: Verify engines
        run: bin/xray version | head -1 && bin/sing-box version | head -1

      - name: Run pipeline (collect + validate + score)
        env:
          ARISTON_XRAY: ${{ github.workspace }}/bin/xray
          ARISTON_SINGBOX: ${{ github.workspace }}/bin/sing-box
          ARISTON_CONCURRENCY: "128"
          ARISTON_TIMEOUT: "4.5"
          ARISTON_TCP_CONCURRENCY: "512"
          ARISTON_TCP_TIMEOUT: "2.0"
        run: python -m pipeline.main run

      # Regenerate the live SVG assets: brand-kit artwork (dark + light,
      # text outlined with the bundled OFL fonts) + QR subscribe cards.
      # Committed to main together with the README stats below, so the
      # images inside the README always match the latest run.
      - name: Generate live assets
        run: |
          pip install -q fonttools uharfbuzz qrcode
          python -m pipeline.assets_gen

      # The README is now fully image-driven: every visual section is an
      # animated SVG generated above from the run's own numbers.  Commit the
      # whole assets/ folder to main — the numbers inside the artwork always
      # match the latest run.  To keep main's history flat, the run amends
      # the bot's own previous assets commit when it is HEAD (force-with-lease
      # keeps this race-safe).
      - name: Commit refreshed live assets
        run: |
          if ! git diff --quiet -- assets; then
            git config user.name  "ariston-bot"
            git config user.email "ariston-bot@users.noreply.github.com"
            git add assets
            if [ "$(git log -1 --pretty=%s)" = "chore: refresh live stats" ]; then
              git commit -q --amend --no-edit
              PUSH_OPTS="--force-with-lease"
            else
              git commit -qm "chore: refresh live stats"
              PUSH_OPTS=""
            fi
            # A concurrent run may win the push race — retry once via rebase,
            # otherwise leave it to the next hourly run (never fail the job).
            git push -q $PUSH_OPTS origin main \
              || { git pull -q --rebase origin main \
                   && git push -q $PUSH_OPTS origin main; } \
              || echo "::warning::assets push lost the race — next hourly run will retry"
            echo "live assets: refreshed"
          else
            echo "live assets: no change"
          fi

      # OPTIONAL: Telegram notification — activates only when the repo has
      # the two secrets below (see docs/notify-mirrors.md for the setup).
      - name: Notify Telegram (optional)
        if: env.TG_BOT_TOKEN != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          tok, chat = os.environ["TG_BOT_TOKEN"], os.environ["TG_CHAT_ID"]
          s = json.load(open("dist/stats.json"))
          v, sc = s.get("validation", {}), s.get("scoring", {})
          lat = (v.get("latency_ms") or {}).get("p50")
          op = s.get("operators") or {}
          msg = ("🏛 Ariston run #" + os.environ.get("GITHUB_RUN_NUMBER", "?") + "\n"
                 "unique: " + str(s.get("unique", 0)) + " | probed: " + str(v.get("probed", 0)) + "\n"
                 "alive: " + str(v.get("alive", 0)) + " | gold: " + str(sc.get("gold", 0))
                 + " / silver: " + str(sc.get("silver", 0)) + "\n"
                 "median: " + (str(lat) + " ms" if lat is not None else "n/a") + "\n"
                 "IR-network endpoints: " + str(op.get("classified_iran", 0)))
          data = urllib.parse.urlencode({"chat_id": chat, "text": msg}).encode()
          urllib.request.urlopen("https://api.telegram.org/bot" + tok + "/sendMessage", data, timeout=20)
          print("notification sent")
          PY

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist
          retention-days: 5

      # Publish to the `data` branch with a force-push: the branch always
      # holds exactly one snapshot commit, so history never bloats.
      - name: Publish to data branch
        run: |
          cd dist
          git init -q -b data
          git config user.name  "ariston-bot"
          git config user.email "ariston-bot@users.noreply.github.com"
          git add .
          git commit -qm "snapshot $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # OPTIONAL: mirror the data branch to any extra git remote (GitLab /
      # Codeberg / ...) — activates only when MIRROR_URL secret exists.
      # Runs AFTER the data-branch publish so dist/ already holds the repo.
      - name: Mirror data branch (optional)
        if: env.MIRROR_URL != ''
        env:
          MIRROR_URL: ${{ secrets.MIRROR_URL }}
        run: |
          cd dist
          git remote add mirror "${MIRROR_URL}"
          git push -q --force mirror data && echo "mirror push: ok" \
            || echo "mirror push failed (non-fatal)"
