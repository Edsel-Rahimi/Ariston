name: pipeline

on:
  schedule:
    - cron: "7,37 * * * *"     # every 30 minutes, at :07 and :37
    - cron: "30 20 * * 6"      # D6/C: Saturday 20:30 UTC = شنبه ۲۴:۰۰ تهران — full scan
  workflow_dispatch:            # manual trigger button
    inputs:
      restore_bank_run:         # U4-1 — run-id whose bank-backup artifact
        description: "Run ID whose bank-backup artifact replaces the live bank.json for this run (empty = live bank)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read                 # U4-1 — needed to download another run's backup artifact

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  XRAY_VERSION: "26.10.29"
  SINGBOX_VERSION: "1.14.4"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full main history — needed for the stats amend step

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch previous health history
        run: |
          mkdir -p dist
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/results.json" \
            -o dist/results.json || echo "no history yet — first run"

      # D6/C — the config bank rides on the data branch; fetched fresh
      # (cache-busted) before the run so the pipeline remembers known-good
      # endpoints and quarantined sources.
      - name: Fetch config bank
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/bank.json?t=$(date +%s)" \
            -o dist/bank.json || echo "no bank yet — first run"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/sources-health.json?t=$(date +%s)" \
            -o dist/sources-health.json || true

      # U4-1 — bank restore path: dispatch with restore_bank_run=<run-id> to
      # rebuild today's run from an older bank snapshot (e.g. after a bad
      # merge or an accidental quarantine wave). Missing artifact → live bank.
      - name: Restore bank from a previous run's backup
        if: ${{ inputs.restore_bank_run != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ inputs.restore_bank_run }}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?name=bank-backup"
          URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$API" \
            | python3 -c 'import json,sys; a=json.load(sys.stdin).get("artifacts",[]); print(a[0]["archive_download_url"] if a else "")') \
            || URL=""
          if [ -n "$URL" ]; then
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$URL" -o /tmp/bank.zip \
              && unzip -oq /tmp/bank.zip -d dist/ \
              && echo "bank restored from run $RUN_ID: $(wc -c < dist/bank.json) bytes" \
              || echo "::warning::artifact download failed — continuing with the live bank"
          else
            echo "::warning::no bank-backup artifact on run $RUN_ID — continuing with the live bank"
          fi

      # D8/H — prefetch the previous snapshot's user-facing exports.  In a
      # normal run the pipeline overwrites them; in a panel «skip_test»
      # emergency run they are left frozen so users never see an empty shelf.
      - name: Fetch previous exports (skip-test freeze source)
        run: |
          for f in gold.txt silver.txt bronze.txt validated.txt all.txt mihomo.yaml singbox.json; do
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/$f?t=$(date +%s)" \
              -o "dist/$f" || echo "no previous $f"
          done
          ls -la dist/ | sed 's/^/      /'

      - name: Restore engines
        id: engines
        uses: actions/cache@v4
        with:
          path: bin
          key: engines-xray-${{ env.XRAY_VERSION }}-sb-${{ env.SINGBOX_VERSION }}

      - name: Fetch engines (pinned)
        if: steps.engines.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          curl -fsSL -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -oq /tmp/xray.zip xray -d bin
          curl -fsSL -o /tmp/sb.tgz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tgz -C /tmp
          mv "/tmp/sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" bin/
          chmod +x bin/xray bin/sing-box

      - name: Verify engines
        run: bin/xray version | head -1 && bin/sing-box version | head -1

      - name: Run pipeline (collect + validate + score)
        env:
          ARISTON_XRAY: ${{ github.workspace }}/bin/xray
          ARISTON_SINGBOX: ${{ github.workspace }}/bin/sing-box
          ARISTON_CONCURRENCY: "128"
          ARISTON_TIMEOUT: "4.5"
          ARISTON_TCP_CONCURRENCY: "512"
          ARISTON_TCP_TIMEOUT: "2.0"
          # D8/H — panel-tunable knobs (bank TTL, pass-2, quarantine, rescue…).
          # The endpoint is public & read-only (no secrets); any failure inside
          # the pipeline falls back to the built-in defaults.
          ARISTON_PIPELINE_CFG_URL: "https://ariston-bot.ariston-vbot.workers.dev/api/pipeline-cfg"
        run: python -m pipeline.main run

      # Publish FIRST: the Worker's /card.svg?fresh=1 then renders THIS run's
      # numbers, so the channel-card PNG below always matches the caption.
      # The `data` branch holds exactly one force-pushed snapshot commit.
      - name: Publish to data branch
        run: |
          cd dist
          git init -q -b data
          git config user.name  "ariston-bot"
          git config user.email "ariston-bot@users.noreply.github.com"
          git add .
          git commit -qm "snapshot $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Regenerate the live SVG assets: brand-kit artwork (dark + light,
      # text outlined with the bundled OFL fonts) + QR subscribe cards.
      # Committed to main together with the README stats below, so the
      # images inside the README always match the latest run.
      - name: Generate live assets
        run: |
          pip install -q fonttools uharfbuzz qrcode
          python -m pipeline.assets_gen

      # Channel card PNG — CI renders the live Worker SVG (the exact brand
      # artwork the bot posts to the channel as a real Telegram photo) and
      # commits it under assets/card/.  resvg static binary → no system deps;
      # Cinzel comes from the bundled fonts, mono from the runner's DejaVu.
      - name: Render channel card PNG
        if: always()
        run: |
          curl -fsSL -o /tmp/resvg.tgz \
            "https://github.com/linebender/resvg/releases/download/v0.45.1/resvg-linux-x86_64.tar.gz" \
            || { echo "::warning::resvg download failed — card png skipped"; exit 0; }
          tar -xzf /tmp/resvg.tgz -C /tmp && chmod +x /tmp/resvg
          curl -fsSL "https://ariston-bot.ariston-vbot.workers.dev/card.svg?fresh=1" -o /tmp/card.svg \
            || { echo "::warning::card.svg unavailable — card png skipped"; exit 0; }
          mkdir -p assets/card
          /tmp/resvg --use-font-file assets/fonts/Cinzel-SemiBold.ttf \
            --serif-family Cinzel --monospace-family "DejaVu Sans Mono" \
            /tmp/card.svg assets/card/card.png \
            && echo "card.png: $(wc -c < assets/card/card.png) bytes"

      # The README is now fully image-driven: every visual section is an
      # animated SVG generated above from the run's own numbers.  Commit the
      # whole assets/ folder to main — the numbers inside the artwork always
      # match the latest run.  To keep main's history flat, the run amends
      # the bot's own previous assets commit when it is HEAD (force-with-lease
      # keeps this race-safe).
      - name: Commit refreshed live assets
        run: |
          if ! git diff --quiet -- assets; then
            git config user.name  "ariston-bot"
            git config user.email "ariston-bot@users.noreply.github.com"
            git add assets
            if [ "$(git log -1 --pretty=%s)" = "chore: refresh live stats" ]; then
              git commit -q --amend --no-edit
              PUSH_OPTS="--force-with-lease"
            else
              git commit -qm "chore: refresh live stats"
              PUSH_OPTS=""
            fi
            # A concurrent run may win the push race — retry once via rebase,
            # otherwise leave it to the next hourly run (never fail the job).
            git push -q $PUSH_OPTS origin main \
              || { git pull -q --rebase origin main \
                   && git push -q $PUSH_OPTS origin main; } \
              || echo "::warning::assets push lost the race — next hourly run will retry"
            echo "live assets: refreshed"
          else
            echo "live assets: no change"
          fi

      # OPTIONAL: Telegram notification — activates only when the repo has
      # the two secrets below (see docs/notify-mirrors.md for the setup).
      - name: Notify Telegram (optional)
        if: env.TG_BOT_TOKEN != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          tok, chat = os.environ["TG_BOT_TOKEN"], os.environ["TG_CHAT_ID"]
          s = json.load(open("dist/stats.json"))
          v, sc = s.get("validation", {}), s.get("scoring", {})
          lat = (v.get("latency_ms") or {}).get("p50")
          op = s.get("operators") or {}
          msg = ("🏛 Ariston run #" + os.environ.get("GITHUB_RUN_NUMBER", "?") + "\n"
                 "unique: " + str(s.get("unique", 0)) + " | probed: " + str(v.get("probed", 0)) + "\n"
                 "alive: " + str(v.get("alive", 0)) + " | gold: " + str(sc.get("gold", 0))
                 + " / silver: " + str(sc.get("silver", 0)) + "\n"
                 "median: " + (str(lat) + " ms" if lat is not None else "n/a") + "\n"
                 "IR-network endpoints: " + str(op.get("classified_iran", 0)))
          data = urllib.parse.urlencode({"chat_id": chat, "text": msg}).encode()
          urllib.request.urlopen("https://api.telegram.org/bot" + tok + "/sendMessage", data, timeout=20)
          print("notification sent")
          PY

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist
          retention-days: 5

      # U4-1 — dedicated 30-day bank backup: bank.json + source health from
      # every run, restorable via workflow_dispatch → restore_bank_run.
      - name: Upload bank backup artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bank-backup
          path: |
            dist/bank.json
            dist/sources-health.json
          retention-days: 30
          if-no-files-found: ignore

      # OPTIONAL: mirror the data branch to any extra git remote (GitLab /
      # Codeberg / ...) — activates only when MIRROR_URL secret exists.
      # Runs AFTER the data-branch publish so dist/ already holds the repo.
      - name: Mirror data branch (optional)
        if: env.MIRROR_URL != ''
        env:
          MIRROR_URL: ${{ secrets.MIRROR_URL }}
        run: |
          cd dist
          git remote add mirror "${MIRROR_URL}"
          git push -q --force mirror data && echo "mirror push: ok" \
            || echo "mirror push failed (non-fatal)"
