  <text x="426" y="268" font-family="'Inter','Segoe UI',sans-serif" font-size="28" fill="#8CA3C3">A continuously-validated pool of healthy endpoints</text>
  <text font-family="'Vazirmatn','Segoe UI',sans-serif" font-size="31" fill="#00E5A0" direction="rtl" unicode-bidi="plaintext" text-anchor="start" x="1216" y="316">مخزنِ گره‌های سالم — هر ساعت پالایش می‌شود</text>
