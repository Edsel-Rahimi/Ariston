<svg xmlns="http://www.w3.org/2000/svg" width="104" height="36" viewBox="0 0 104 36" role="img" aria-label="中文"><title>中文</title><defs><pattern id="mk" width="20" height="14" patternUnits="userSpaceOnUse"><path d="M0 14V0H14V10H5V5H9" fill="none" stroke="#C9A24A" stroke-width="2"/></pattern></defs><style>.p{transform-box:fill-box;transform-origin:center;animation:p 3.6s ease-in-out infinite}@keyframes p{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.22)}}.f{stroke-dasharray:3 9;animation:f 5s linear infinite}@keyframes f{to{stroke-dashoffset:-48}}.k{animation:k 9s ease-in-out infinite}@keyframes k{0%,100%{opacity:.3}50%{opacity:.65}}.b{animation:b 2.2s ease-in-out infinite}@keyframes b{0%,100%{opacity:1}50%{opacity:.25}}.r{opacity:0;animation:r .9s cubic-bezier(.22,.61,.36,1) both}@keyframes r{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.s{animation:s 7s cubic-bezier(.45,0,.2,1) infinite}@keyframes s{0%{transform:translateX(0);opacity:0}6%{opacity:.9}26%{transform:translateX(var(--sw,1100px));opacity:0}100%{transform:translateX(var(--sw,1100px));opacity:0}}.q{animation:q 4.2s ease-in-out infinite}@keyframes q{0%,100%{opacity:.5}12%,32%{opacity:1}}.o{transform-box:fill-box;transform-origin:center;animation:o 16s linear infinite}@keyframes o{to{transform:rotate(360deg)}}.d{opacity:0;animation:d 1s ease-out both}@keyframes d{from{opacity:0}to{opacity:1}}.w{animation:w 4.9s ease-in-out infinite}@keyframes w{0%,100%{opacity:.55}14%,42%{opacity:1}}.pk{animation:pk 4s linear infinite}@keyframes pk{from{transform:translateX(0)}to{transform:translateX(250px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.r,.d{opacity:1!important}}</style><rect x="0.5" y="0.5" width="103" height="35" rx="18" fill="#14110C" stroke="#C9A24A" stroke-width="1"/><text x="52.0" y="24" text-anchor="middle" font-size="15" fill="#A8946A" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif">中文</text></svg>